name: Flutter Nightly Build

on:
  # schedule:
    # schedule build every night
    # - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    # flutter-build.yml declares job-level `permissions: contents: write` (release
    # publishing). A reusable workflow cannot be granted more than the caller
    # allows, so without this the whole run ends in `startup_failure`.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
